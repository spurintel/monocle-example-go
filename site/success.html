<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monocle Client Server</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fragment+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --black: #141414;
            --white: #fafafa;
            --neon: #ceff00;
            --gunmetal: #414141;
            --charcoal: #5a5a5a;
            --ash: #8d8d8d;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--black);
            color: var(--white);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            border-bottom: 1px solid var(--gunmetal);
        }

        header .brand img {
            height: 28px;
            width: auto;
            /* Logo ships as dark text on a transparent background; invert it for dark surfaces. */
            filter: invert(1);
        }

        header .tag {
            font-family: "Fragment Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            letter-spacing: 0.28px;
            text-transform: uppercase;
            color: var(--neon);
        }

        main {
            flex: 1;
            padding: 60px 40px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .eyebrow {
            font-family: "Fragment Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            letter-spacing: 0.28px;
            text-transform: uppercase;
            color: var(--neon);
            margin: 0 0 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .eyebrow::before {
            content: "";
            width: 7px;
            height: 7px;
            background: var(--neon);
            display: inline-block;
        }

        h1 {
            font-size: 5rem;
            font-weight: 300;
            margin: 0 0 16px;
            line-height: 1;
            letter-spacing: -4.8px;
        }

        .user-line {
            font-size: 1rem;
            font-weight: 400;
            color: var(--ash);
            margin: 0 0 48px;
            letter-spacing: -0.16px;
        }

        .user-line strong {
            color: var(--white);
            font-weight: 500;
        }

        .panel-label {
            font-family: "Fragment Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            letter-spacing: 0.28px;
            text-transform: uppercase;
            color: var(--ash);
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--gunmetal);
        }

        #json-output {
            background: transparent;
            border: 1px solid var(--gunmetal);
            border-radius: 0;
            padding: 24px;
            color: var(--white);
            font-family: "Fragment Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            line-height: 1.5;
            letter-spacing: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow: auto;
            margin: 0;
        }

        footer {
            padding: 20px 40px;
            border-top: 1px solid var(--gunmetal);
            font-family: "Fragment Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            letter-spacing: 0.28px;
            text-transform: uppercase;
            color: var(--charcoal);
            text-align: center;
        }

        @media (max-width: 640px) {
            header { padding: 16px 20px; }
            main { padding: 40px 20px; }
            h1 { font-size: 3rem; letter-spacing: -2.112px; }
            .user-line { margin-bottom: 32px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <img src="/logo.png" alt="Spur">
        </div>
        <div class="tag">Monocle Client</div>
    </header>

    <main>
        <p class="eyebrow">Authenticated</p>
        <h1>Access granted.</h1>
        <p class="user-line">Signed in as <strong>{{ .Username }}</strong></p>

        <div class="panel-label">Monocle Enrichment Bundle</div>
        <pre id="json-output">{{ .Bundle }}</pre>
    </main>

    <footer>Reveal the truth hiding in plain sight.</footer>
</body>
</html>
